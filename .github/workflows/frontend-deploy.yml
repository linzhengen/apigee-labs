name: Frontend - Docker Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths: ["apps/frontend/**"]
  workflow_dispatch:

# OSS セキュリティ: secrets を使うことでログからマスクされる
# vars (GCP_PROJECT_ID, GCP_REGION) はマスクされないため secrets に移行
env:
  SERVICE_NAME: frontend-service
  REPOSITORY: docker

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # OSS セキュリティ: environment による保護 (承認ルール設定可能)
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        working-directory: apps/frontend
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE_NAME}"
          TAG="${GITHUB_SHA::8}"

          docker build \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # Cloud Run にデプロイ (LB + IAP 経由のみアクセス可能)
      # --quiet: デプロイ後の URL 出力を抑制
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE_NAME}:${TAG}" \
            --region="${{ secrets.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --service-account="${SERVICE_NAME}-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --ingress=internal-and-cloud-load-balancing \
            --no-allow-unauthenticated \
            --quiet

      - name: Summary
        run: |
          echo "### Frontend Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service**: \`${SERVICE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
